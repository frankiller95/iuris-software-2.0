<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <i class="pi pi-building-columns"></i>
      <h1>Iuris Software</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" styleClass="w-full mb-3" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="username" class="w-full" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="p-error">Ingresa un correo válido.</small>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true"
          autocomplete="current-password" styleClass="w-full" inputStyleClass="w-full" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="p-error">La contraseña es obligatoria.</small>
        }
      </div>

      <p-button type="submit" label="Iniciar sesión" icon="pi pi-sign-in" [loading]="loading()" styleClass="w-full" />
    </form>
  </div>
</div>
