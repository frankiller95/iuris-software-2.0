<div class="layout" [class.sidebar-open]="sidebarOpen()">
  <aside class="sidebar">
    <div class="brand">
      <i class="pi pi-building-columns"></i>
      <span>Iuris Software</span>
    </div>
    <nav>
      <span class="section">Módulos</span>
      @for (item of menu(); track item.label) {
        @if (item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" (click)="closeSidebar()">
            <i [class]="item.icon"></i>{{ item.label }}
          </a>
        } @else {
          <a class="disabled" title="Próximamente"><i [class]="item.icon"></i>{{ item.label }}<small>Pronto</small></a>
        }
      }
    </nav>
  </aside>
  <div class="backdrop" (click)="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <div class="title">
        <p-button icon="pi pi-bars" [text]="true" severity="contrast" styleClass="menu-btn" (onClick)="sidebarOpen.set(true)" ariaLabel="Abrir menú" />
        <div>
          <small>Páginas / {{ pageTitle() }}</small>
          <h2>{{ pageTitle() }}</h2>
        </div>
      </div>
      <div class="user">
        <span class="name">{{ auth.user()?.nombre_completo }}</span>
        <p-button label="Cerrar sesión" icon="pi pi-sign-out" [text]="true" severity="contrast" (onClick)="auth.logout()" />
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
    <footer>© {{ 2025 }}, ZapataDiosa abogados todos los derechos reservados.</footer>
  </div>
</div>
